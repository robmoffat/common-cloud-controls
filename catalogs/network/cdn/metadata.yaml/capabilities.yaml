capabilities:
  - id: CCC.CDN.CP01
    group: Network
    title: Edge Content Caching
    description: |
      The service always caches static and dynamic content at distributed edge locations closest to users to reduce latency and accelerate delivery.

  - id: CCC.CDN.CP02
    group: Security
    title: Origin Access Restriction
    description: |
      The service may be configured to restrict origin access so only authorized CDN nodes can retrieve content, preventing direct access by end-users.

  - id: CCC.CDN.CP03
    group: Security
    title: Web Application Firewall Integration
    description: |
      The service may be configured to integrate with a web application firewall, automatically inspecting and filtering HTTP(S) requests for threats before content is served.

  - id: CCC.CDN.CP04
    group: Network
    title: Custom Domain Support
    description: |
      The service may be configured to serve content under custom domain names, enabling branded URL presentation and SSL certificate management.

  - id: CCC.CDN.CP05
    group: Network
    title: Request Routing Rules
    description: |
      The service may be configured to route requests based on content path, headers, or other criteria, automatically directing traffic to optimal origin or edge resources.

  - id: CCC.CDN.CP06
    group: Network
    title: Cache Invalidation
    description: |
      The service may be configured to invalidate cached content automatically or on demand, ensuring users receive fresh data when updates occur.

  - id: CCC.CDN.CP07
    group: Network
    title: HTTP Protocol Support
    description: |
      The service always supports standard HTTP and HTTPS protocols for content delivery, enabling interoperability with web clients.

  - id: CCC.CDN.CP08
    group: Performance
    title: Compression and Optimization
    description: |
      The service may be configured to compress or optimize content automatically during delivery, reducing bandwidth and improving transfer speed.

  - id: CCC.CDN.CP09
    group: Security
    title: DDoS Mitigation
    description: |
      The service always provides distributed denial-of-service mitigation, automatically protecting content delivery infrastructure from volumetric attacks.

  - id: CCC.CDN.CP10
    group: Network
    title: Geographic Routing
    description: |
      The service may be configured to route end-user requests geographically, directing traffic to edge locations based on user location for optimal performance.

  - id: CCC.CDN.CP11
    group: Network
    title: Origin Failover
    description: |
      The service may be configured to automatically redirect requests to backup origins when the primary origin becomes unavailable, ensuring content continuity.

  - id: CCC.CDN.CP12
    group: Network
    title: Real-Time Purge
    description: |
      The service may be configured to purge cached assets in real-time across all edge locations, ensuring immediate removal of outdated or compromised content.

  - id: CCC.CDN.CP13
    group: Security
    title: TLS Certificate Management
    description: |
      The service may be configured to manage and auto-renew transport layer security certificates for custom domains, always providing secure content delivery.
