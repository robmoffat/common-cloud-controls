metadata:
  id: CCC.CDN
  title: CCC Content Delivery Network
  description: |
    Content Delivery Network (CDN) services accelerate the distribution of web content by caching and serving assets from edge locations closer to end-users. CDNs optimize network performance, reduce latency, and improve security for publicly accessible websites and applications, supporting scalability and availability in cloud environments.
