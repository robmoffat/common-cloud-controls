capabilities:
  - id: CCC.CDN.CP01
    group: Distribution
    title: Edge Content Caching
    description: |
      The service always caches web content, media files, and APIs at edge locations worldwide to optimize delivery speed and reduce latency.

  - id: CCC.CDN.CP02
    group: Distribution
    title: Origin Failover
    description: |
      The service can automatically route requests to alternate origins when the primary origin is unavailable to maintain content availability.

  - id: CCC.CDN.CP03
    group: Distribution
    title: Content Purge
    description: |
      The service can remove cached content from all edge locations when an administrator triggers a purge event to ensure content freshness.

  - id: CCC.CDN.CP04
    group: Distribution
    title: Custom Cache Rules
    description: |
      The service may be configured to support custom cache expiration, invalidation, and behavior rules for content served at edge locations.

  - id: CCC.CDN.CP05
    group: Security
    title: DDoS Mitigation
    description: |
      The service always protects web applications by automatically detecting and mitigating distributed denial-of-service attacks at edge locations.

  - id: CCC.CDN.CP06
    group: Security
    title: Web Application Firewall Integration
    description: |
      The service may be configured to integrate with a web application firewall to automatically inspect and block malicious or unwanted traffic.

  - id: CCC.CDN.CP07
    group: Distribution
    title: Protocol Negotiation
    description: |
      The service always negotiates supported protocols such as HTTP/2 and HTTP/3 with clients to optimize delivery and compatibility.

  - id: CCC.CDN.CP08
    group: Security
    title: TLS Certificate Management
    description: |
      The service may be configured to automatically provision, renew, and rotate TLS certificates for secure content delivery.

  - id: CCC.CDN.CP09
    group: Distribution
    title: Compression Support
    description: |
      The service always compresses content using standard algorithms before delivery to reduce bandwidth and accelerate transfer times.

  - id: CCC.CDN.CP10
    group: Distribution
    title: Global Routing Optimization
    description: |
      The service always selects the optimal edge location for each request to minimize latency and maximize performance.

  - id: CCC.CDN.CP11
    group: Distribution
    title: Custom Domain Support
    description: |
      The service may be configured to deliver content under custom domains managed by the user for branding and flexibility.

  - id: CCC.CDN.CP12
    group: Management
    title: Real-Time Configuration Updates
    description: |
      The service may be configured to propagate configuration changes to all edge locations in real time for immediate effect.
