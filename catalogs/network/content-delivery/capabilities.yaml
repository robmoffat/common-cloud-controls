capabilities:
  - id: CCC.CDN.CP01
    group: Data
    title: Content Caching
    description: |
      The service always caches static and dynamic content in distributed edge locations to accelerate content delivery and reduce latency.

  - id: CCC.CDN.CP02
    group: Data
    title: Cache Invalidation
    description: |
      The service can invalidate cached content automatically or manually to ensure freshness and consistency across edge locations.

  - id: CCC.CDN.CP03
    group: Security
    title: Origin Access Control
    description: |
      The service can be configured to restrict and secure access to origin servers through authenticated requests and custom header enforcement.

  - id: CCC.CDN.CP04
    group: Security
    title: DDoS Protection
    description: |
      The service always provides network-level protection against Distributed Denial of Service attacks as part of the delivery infrastructure.

  - id: CCC.CDN.CP05
    group: Network
    title: Custom Domain Support
    description: |
      The service can be configured to deliver content using customer-owned domains by managing DNS records and SSL certificates.

  - id: CCC.CDN.CP06
    group: Data
    title: Origin Failover
    description: |
      The service can automatically redirect requests to alternate origins when the primary origin is unreachable.

  - id: CCC.CDN.CP07
    group: Data
    title: Content Compression
    description: |
      The service can automatically compress content using standard algorithms (e.g., Gzip, Brotli) to optimize bandwidth and delivery speed.

  - id: CCC.CDN.CP08
    group: Access
    title: Geo-based Access Control
    description: |
      The service can restrict or allow content delivery based on requestor geographic location according to configurable access rules.

  - id: CCC.CDN.CP09
    group: Security
    title: HTTPS Enforcement
    description: |
      The service can enforce HTTPS for content delivery to ensure secure transmission to users.

  - id: CCC.CDN.CP10
    group: Data
    title: Real-Time Purge
    description: |
      The service can purge content from cache immediately across all edge nodes when required for compliance or content updates.
