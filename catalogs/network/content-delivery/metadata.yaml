metadata:
  id: CCC.CDN
  title: CCC Content Delivery Network
  description: |
    A Content Delivery Network (CDN) is a distributed cloud service that accelerates and optimizes the delivery of web content, APIs, and media across the globe. CDNs enhance performance, reduce latency, and provide security features by caching content at edge locations close to users. They are essential for scalable, reliable, and secure content distribution in cloud environments.
